# Application Name & Server
spring.application.name=backend
server.port=${SERVER_PORT:8080}

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:football_shop}?stringtype=unspecified
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Custom Business Logic Properties
app.promotion.discount-threshold=${DISCOUNT_THRESHOLD:30}
spring.main.allow-bean-definition-overriding=true

# MoMo Payment Gateway Config
momo.partner-code=${MOMO_PARTNER_CODE:MOMOBKUN20180529}
momo.access-key=${MOMO_ACCESS_KEY:klm05Bh5mEs15crK}
momo.secret-key=${MOMO_SECRET_KEY:at1Rw5Bt1y450dgObHA15Qo1U1s05n5w}
momo.api-endpoint=${MOMO_API_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
momo.redirect-url=${MOMO_REDIRECT_URL:http://localhost:5173/dat-hang-thanh-cong}
momo.ipn-url=${MOMO_IPN_URL:http://localhost:8080/api/webhooks/momo}

# JWT Security Config (Điền khi sử dụng JWT token mở rộng)
jwt.secret=${JWT_SECRET:your_super_secret_jwt_key_here_minimum_256_bits}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Mail SMTP Config (Điền khi cấu hình dịch vụ gửi Email)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
